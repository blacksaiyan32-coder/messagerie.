<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d3e">
<title>CampusFlow.ISIPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9f0ee; --surface:#ffffff; --ink:#14262b; --muted:#5d7478;
  --brand:#0f3d3e; --brand-ink:#ffffff; --accent:#e4572e; --line:#d3dfdc;
  --mine:#0f3d3e; --mine-ink:#f2fbf9; --radius:20px;
  --title:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0c1819; --surface:#152a2c; --ink:#e6f1ef; --muted:#8aa5a8; --brand:#1d6b63;
    --line:#244245; --mine:#1d6b63; --mine-ink:#ffffff}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;
  -webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- Connexion ---------- */
#auth{min-height:100%;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.auth-box{width:100%;max-width:420px}
.logo{font-family:var(--title);font-variant-caps:all-small-caps;font-weight:700;font-size:clamp(34px,11vw,48px);line-height:1;letter-spacing:.14em;color:var(--brand)}
@media (prefers-color-scheme:dark){.logo{color:#7fd6c8}}
.tagline{margin:12px 0 28px;color:var(--muted);font-size:17px;max-width:30ch}
.card{background:var(--surface);border-radius:var(--radius);padding:20px;border:1px solid var(--line)}
.tabs{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
.field{margin-bottom:14px}
input[type=text],input[type=email],input[type=password]{width:100%;padding:13px 14px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--bg);font-size:16px}
input:focus{border-color:var(--brand);outline:none}
.primary{width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;cursor:pointer;
  background:var(--brand);color:var(--brand-ink)}
.primary:disabled{opacity:.6}
.error{color:#c0341a;font-size:14px;margin:0 0 12px;min-height:0}
@media (prefers-color-scheme:dark){.error{color:#ff9a80}}

.signature{margin-top:26px;text-align:center;font-family:var(--title);font-variant-caps:all-small-caps;font-size:15px;font-weight:600;letter-spacing:.18em;color:var(--muted)}
.signature::before{content:"";display:block;width:28px;height:2px;margin:0 auto 12px;background:var(--accent);border-radius:2px}
.signature span{color:var(--ink)}

/* ---------- Chat ---------- */
#chat{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:var(--brand);color:var(--brand-ink)}
header h1{font-family:var(--title);font-variant-caps:all-small-caps;font-size:22px;font-weight:700;letter-spacing:.14em;line-height:1.15;flex:1}
header small{opacity:.8;font-size:14px;font-family:var(--body);font-variant-caps:normal;letter-spacing:0;font-weight:500}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent);color:#fff}
.ghost{border:1.5px solid rgba(255,255,255,.4);background:none;color:inherit;padding:7px 12px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
#list{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain}
.day{align-self:center;margin:14px 0 8px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);
  padding:4px 12px;border-radius:99px;border:1px solid var(--line)}
.msg{max-width:82%;padding:8px 12px 6px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);
  align-self:flex-start;border-bottom-left-radius:6px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--mine);color:var(--mine-ink);border-color:transparent;
  border-bottom-left-radius:var(--radius);border-bottom-right-radius:6px}
.msg.first{margin-top:8px}
.who{font-family:var(--title);font-variant-caps:all-small-caps;letter-spacing:.1em;font-size:16px;font-weight:700;margin-bottom:1px}
.txt{white-space:pre-wrap}
.time{font-size:11.5px;opacity:.6;text-align:right;margin-top:2px}
.msg img{display:block;max-width:100%;max-height:300px;border-radius:12px;margin:4px 0}
.file{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:4px 0;border-radius:12px;text-decoration:none;
  background:rgba(127,127,127,.15);color:inherit;font-weight:600;font-size:15px}
.file svg{flex:none}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:26ch}
form#composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--line)}
#text{flex:1;resize:none;max-height:140px;padding:11px 14px;border-radius:22px;border:1.5px solid var(--line);
  background:var(--bg);font-size:16px;line-height:1.35}
#text:focus{outline:none;border-color:var(--brand)}
.round{flex:none;width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}
#attach{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
#send{background:var(--accent);color:#fff}
.round:disabled{opacity:.5}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:90%;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .msg{animation:pop .18s ease-out}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>
<body>

<!-- CONNEXION -->
<main id="auth" class="hidden">
  <div class="auth-box">
    <div class="logo">CampusFlow.ISIPA</div>
    <p class="tagline">La messagerie de la communauté ISIPA.</p>
    <div class="card">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-login" aria-selected="true">Se connecter</button>
        <button type="button" role="tab" id="tab-signup" aria-selected="false">Créer un compte</button>
      </div>
      <form id="authForm">
        <div class="field hidden" id="pseudoField">
          <label for="pseudo">Pseudo</label>
          <input id="pseudo" type="text" maxlength="24" autocomplete="nickname">
        </div>
        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Mot de passe (6 caractères minimum)</label>
          <input id="password" type="password" minlength="6" autocomplete="current-password" required>
        </div>
        <p class="error" id="authError" role="alert"></p>
        <button class="primary" id="authBtn" type="submit">Se connecter</button>
      </form>
    </div>
    <p class="signature">Created by <span>Winnie Kikumbila Lemba</span></p>
  </div>
</main>

<!-- CHAT -->
<div id="chat" class="hidden">
  <header>
    <div class="avatar" id="meAvatar">?</div>
    <h1>CampusFlow.ISIPA<br><small id="meName"></small></h1>
    <button class="ghost" id="logout" type="button">Déconnexion</button>
  </header>
  <div id="list" aria-live="polite"></div>
  <form id="composer">
    <input type="file" id="fileInput" class="hidden">
    <button class="round" id="attach" type="button" aria-label="Envoyer un fichier">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
    </button>
    <textarea id="text" rows="1" placeholder="Écrire un message" aria-label="Message"></textarea>
    <button class="round" id="send" type="submit" aria-label="Envoyer le message">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.5-7.5a1 1 0 0 0 0-1.8L3.4 3.6a1 1 0 0 0-1.4 1.2L4 10.5l9 1.5-9 1.5-2 5.7a1 1 0 0 0 1.4 1.2z"/></svg>
    </button>
  </form>
</div>
<div id="toast" class="hidden" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
// ====== À MODIFIER : colle tes deux valeurs Supabase entre les guillemets ======
const SUPABASE_URL = "https://vijupdhttlamcnueayeu.supabase.co";
const SUPABASE_KEY = "sb_publishable_bd6HKQN5FWXy5Wo8FqdwUw_ZoOMJEDW";
// ================================================================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const MAX_MO = 10;
let me = null, pseudoMe = "", mode = "login", seen = new Set(), lastDay = "", lastAuthor = "", channel = null;

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.remove("hidden"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.add("hidden"),3500); }
function setError(t){ $("authError").textContent = t || ""; }
function color(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 55% 40%)`; }
function frError(m){
  const s=(m||"").toLowerCase();
  if(s.includes("invalid login")) return "E-mail ou mot de passe incorrect.";
  if(s.includes("already")) return "Cette adresse e-mail a déjà un compte. Connecte-toi.";
  if(s.includes("password")) return "Le mot de passe doit contenir au moins 6 caractères.";
  if(s.includes("rate")||s.includes("seconds")) return "Trop d'essais. Attends une minute et réessaie.";
  if(s.includes("fetch")||s.includes("network")) return "Pas de connexion. Vérifie ton réseau.";
  return "Erreur : " + m;
}

/* ----- Onglets connexion / inscription ----- */
function setMode(m){
  mode = m;
  $("tab-login").setAttribute("aria-selected", m==="login");
  $("tab-signup").setAttribute("aria-selected", m==="signup");
  $("pseudoField").classList.toggle("hidden", m!=="signup");
  $("pseudo").required = m==="signup";
  $("authBtn").textContent = m==="login" ? "Se connecter" : "Créer mon compte";
  $("password").autocomplete = m==="login" ? "current-password" : "new-password";
  setError("");
}
$("tab-login").onclick = () => setMode("login");
$("tab-signup").onclick = () => setMode("signup");

$("authForm").onsubmit = async e => {
  e.preventDefault(); setError("");
  const email=$("email").value.trim(), password=$("password").value;
  $("authBtn").disabled = true;
  try{
    if(mode==="signup"){
      const pseudo=$("pseudo").value.trim();
      if(pseudo.length<2){ setError("Le pseudo doit contenir au moins 2 caractères."); return; }
      const {data,error}=await db.auth.signUp({email,password,options:{data:{pseudo}}});
      if(error) throw error;
      if(!data.session){ setError("Compte créé. Confirme ton e-mail, puis connecte-toi."); return; }
      await start(data.user);
    }else{
      const {data,error}=await db.auth.signInWithPassword({email,password});
      if(error) throw error;
      await start(data.user);
    }
  }catch(err){ setError(frError(err.message)); }
  finally{ $("authBtn").disabled = false; }
};

/* ----- Démarrage du chat ----- */
async function start(user){
  me = user;
  pseudoMe = (user.user_metadata && user.user_metadata.pseudo) || user.email.split("@")[0];
  const {error} = await db.from("profils").upsert({id:user.id,pseudo:pseudoMe},{onConflict:"id",ignoreDuplicates:true});
  if(error){ toast("Profil impossible à créer : "+error.message); }
  $("meName").textContent = pseudoMe;
  $("meAvatar").textContent = pseudoMe[0].toUpperCase();
  $("auth").classList.add("hidden");
  $("chat").classList.remove("hidden");
  $("list").innerHTML = ""; seen = new Set(); lastDay = ""; lastAuthor = "";

  const {data,error:e2} = await db.from("messages").select("*").order("cree_le",{ascending:false}).limit(100);
  if(e2){ toast("Messages illisibles : "+e2.message); }
  else if(!data.length){ $("list").innerHTML = '<p class="empty">Aucun message pour l\'instant. Écris le premier.</p>'; }
  (data||[]).reverse().forEach(m => addMessage(m, true));
  scrollDown(true);

  if(channel) db.removeChannel(channel);
  channel = db.channel("messages-live")
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"}, p => addMessage(p.new,false))
    .subscribe();
}

/* ----- Affichage d'un message ----- */
const isImg = n => /\.(png|jpe?g|gif|webp|avif)$/i.test(n||"");
function addMessage(m, bulk){
  if(seen.has(m.id)) return; seen.add(m.id);
  const list=$("list"), empty=list.querySelector(".empty"); if(empty) empty.remove();
  const d=new Date(m.cree_le), dayKey=d.toDateString();
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 140;
  if(dayKey!==lastDay){
    const s=document.createElement("div"); s.className="day";
    s.textContent=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
    list.appendChild(s); lastDay=dayKey; lastAuthor="";
  }
  const mine = m.auteur===me.id;
  const box=document.createElement("div");
  box.className="msg"+(mine?" me":"")+(lastAuthor!==m.auteur?" first":"");
  if(!mine && lastAuthor!==m.auteur){
    const w=document.createElement("div"); w.className="who"; w.textContent=m.pseudo; w.style.color=color(m.pseudo); box.appendChild(w);
  }
  if(m.fichier_url){
    if(isImg(m.fichier_nom)){
      const a=document.createElement("a"); a.href=m.fichier_url; a.target="_blank"; a.rel="noopener";
      const im=document.createElement("img"); im.src=m.fichier_url; im.alt=m.fichier_nom||"Image"; im.loading="lazy";
      im.onload=()=>{ if(nearBottom||mine) scrollDown(); };
      a.appendChild(im); box.appendChild(a);
    }else{
      const a=document.createElement("a"); a.className="file"; a.href=m.fichier_url; a.target="_blank"; a.rel="noopener"; a.download=m.fichier_nom||"";
      a.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
      const sp=document.createElement("span"); sp.textContent=m.fichier_nom||"Fichier"; a.appendChild(sp); box.appendChild(a);
    }
  }
  if(m.texte){ const t=document.createElement("div"); t.className="txt"; t.textContent=m.texte; box.appendChild(t); }
  const tm=document.createElement("div"); tm.className="time";
  tm.textContent=d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); box.appendChild(tm);
  list.appendChild(box); lastAuthor=m.auteur;
  if(!bulk && (nearBottom||mine)) scrollDown();
}
function scrollDown(){ const l=$("list"); l.scrollTop=l.scrollHeight; }

/* ----- Envoi ----- */
async function sendMessage(texte, fichier){
  const row={auteur:me.id,pseudo:pseudoMe,texte:texte||null,fichier_url:fichier?fichier.url:null,fichier_nom:fichier?fichier.nom:null};
  const {error}=await db.from("messages").insert(row);
  if(error) toast("Envoi impossible : "+error.message);
}
const ta=$("text");
ta.addEventListener("input",()=>{ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,140)+"px"; });
ta.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey && matchMedia("(pointer:fine)").matches){ e.preventDefault(); $("composer").requestSubmit(); }
});
$("composer").onsubmit = async e => {
  e.preventDefault();
  const t=ta.value.trim(); if(!t) return;
  ta.value=""; ta.style.height="auto"; ta.focus();
  await sendMessage(t);
};
$("attach").onclick = () => $("fileInput").click();
$("fileInput").onchange = async e => {
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  if(f.size>MAX_MO*1024*1024){ toast("Fichier trop lourd (maximum "+MAX_MO+" Mo)."); return; }
  $("attach").disabled=true; toast("Envoi du fichier…");
  try{
    const ext=(f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,8)||"bin";
    const path=`${me.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error}=await db.storage.from("fichiers").upload(path,f,{contentType:f.type||"application/octet-stream"});
    if(error) throw error;
    const url=db.storage.from("fichiers").getPublicUrl(path).data.publicUrl;
    await sendMessage(ta.value.trim(), {url,nom:f.name});
    ta.value=""; ta.style.height="auto";
    $("toast").classList.add("hidden");
  }catch(err){ toast("Échec de l'envoi : "+err.message); }
  finally{ $("attach").disabled=false; }
};

/* ----- Déconnexion et lancement ----- */
$("logout").onclick = async () => {
  if(channel){ db.removeChannel(channel); channel=null; }
  await db.auth.signOut(); me=null;
  $("chat").classList.add("hidden"); $("auth").classList.remove("hidden");
  $("password").value="";
};
(async () => {
  const {data}=await db.auth.getSession();
  if(data.session) await start(data.session.user);
  else $("auth").classList.remove("hidden");
})();
</script>
</body>
  </html>
